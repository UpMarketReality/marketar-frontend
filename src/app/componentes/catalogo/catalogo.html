 <main class="catalogo">
    <!-- encabezado principal-->
  <header class="encabezado">
    <h1>Catálogo de Diseños</h1>
    <p>
      Explora muebles personalizados generados por IA
      y creados por fabricantes certificados.
    </p>
  </header>

  <!--buscados y filtros de búsqueda-->
  <section class="panel-de-filtros">
    <!-- barra de búsqueda y ordenamiento -->
     <div class="barra-herramientas">
        <div class="buscador">
            <span class="icono-lupa" aria-hidden="true">🔍</span>

            <input
            type="text"
            placeholder="Buscar por tipo de mueble, estilo o artesano..."
            aria-label="Buscar Diseños">
        </div>

        <button class="selector-orden">
            Odernar por: Más recientes
        </button>
     </div>

     <!-- categorias-->
      <nav class="categorias" aria-label="Categorias de busqueda">
        <button class ="categoria activa">Todos</button>
        <button class ="categoria">Armarios & Closets</button>
        <button class ="categoria">Mesas de Noche</button>
        <button class ="categoria">Sillones & Sofás</button>
        <button class ="categoria">Escritorios</button>
        <button class ="categoria">Comedores</button>
        <button class ="categoria">Estanterías</button>
      </nav>
  </section>
</main>
