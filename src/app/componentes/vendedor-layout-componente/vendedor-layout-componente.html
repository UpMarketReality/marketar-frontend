
<div class="app_layout">
  <!-- Barra lateral del vendedor -->
  <aside class="side_bar">
    <!-- LOGO MARKET AR -->
    <div class="brand_container">
      <span class="brand_mark">
        <svg class="brand_icon" aria-hidden="true" viewBox="0 0 24 24">
          <path d="m3 6 9-4 9 4v12l-9 4-9-4Zm0 0 9 4 9-4M12 10v12M7 4l10 4"/>
        </svg>
      </span>
      <div class="brand_text">
        <span class="brand_name">MARKET <strong>AR</strong></span>
        <span class="brand_sub">Panel de vendedor</span>
      </div>
    </div>
    <mat-nav-list class="side_nanv" aria-label="Menú del vendedor">

      <!-- MAR-13: PERFIL PUBLICO DEL VENDEDOR -->
      <a mat-list-item
         routerLink="/perfil-vendedor"
         routerLinkActive="item_activo"
         [routerLinkActiveOptions]="{ exact: true }"
         class="nav_item">
        <mat-icon matListItemIcon>person</mat-icon>
        Perfil
      </a>

      <!-- MIS PRODUCTOS -->
      <a mat-list-item
         routerLink="/perfil-vendedor/productos"
         [class.item_activo]="productosActivo()"
         class="nav_item">
        <mat-icon matListItemIcon>sell</mat-icon>
        Mis productos
      </a>

      <!-- RESUMEN GENERAL -->
      <a mat-list-item
         routerLink="/perfil-vendedor/resumen"
         routerLinkActive="item_activo"
         class="nav_item">
        <mat-icon matListItemIcon>bar_chart</mat-icon>
        Resumen
      </a>

      <!-- GESTOR DE PEDIDOS -->
      <a mat-list-item
         routerLink="/perfil-vendedor/gestor-pedidos"
         routerLinkActive="item_activo"
         class="nav_item">
        <mat-icon matListItemIcon>package_2</mat-icon>
        Gestor de pedidos
      </a>

      <!-- MAR-12: COTIZACIONES Y FINANZAS -->
      <!-- Pendiente de integrar su componente -->
      <a mat-list-item
         routerLink="/perfil-vendedor/cotizaciones"
         routerLinkActive="item_activo"
         class="nav_item">
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        Cotizaciones y finanzas
      </a>

    </mat-nav-list>
    <!-- VOLVER AL INICIO (tienda del comprador, sin cerrar sesión) -->
    <div class="home_container">
      <button matButton="text" type="button" class="home_btn" routerLink="/home1">
        <mat-icon>home</mat-icon>
        Volver al inicio
      </button>
    </div>

    <!-- CERRAR SESION -->
    <div class="logout_container">
      <button matButton="text" type="button" class="logout_btn">
        <mat-icon>logout</mat-icon>
        Cerrar sesión
      </button>
    </div>

  </aside>

  <!-- CONTENIDO PRINCIPAL DEL VENDEDOR -->
  <main id="contenido_main_vendedor">
    <router-outlet></router-outlet>
  </main>

</div>
