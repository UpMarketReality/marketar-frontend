<div class="account-layout">
  <aside class="sidebar">

      <aside class="sidebar" aria-label="Cuenta del comprador">
        <div class="user-summary">
          <div class="avatar-wrap">
            <img
              class="avatar"
              src="assets/avatar.svg"
              width="70"
              height="70"
              alt="Avatar ilustrado de Juan Pérez"
            /><button
            class="avatar-edit"
            type="button"
            aria-label="Cambiar foto de perfil"
            data-action="avatar"
          >
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M3 6h4l2-3h6l2 3h4v15H3Z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
          </button>
          </div>
          <div>
            <h2 data-user-name>Juan Pérez</h2>
            <p>Cliente registrado</p>
          </div>
        </div>
        <input
          class="visually-hidden"
          type="file"
          id="avatar-upload"
          accept="image/jpeg,image/png,image/webp"
          tabindex="-1"
          aria-label="Seleccionar foto de perfil"
        />
        <nav class="account-nav" aria-label="Opciones del perfil">
          <a
            routerLink="/perfil-comprador/datos"
            routerLinkActive="activo"
            ariaCurrentWhenActive="page"
          >
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21v-2a8 8 0 0 1 16 0v2Z" /></svg>
            <span>Configurar datos</span>
          </a>

          <a
            routerLink="/perfil-comprador/direccion"
            routerLinkActive="activo"
            ariaCurrentWhenActive="page">
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z" />
            <circle cx="12" cy="10" r="2.5" /></svg>
            <span>Dirección de envío</span>
          </a>

          <a
            routerLink="/perfil-comprador/pedidos"
            routerLinkActive="activo"
            ariaCurrentWhenActive="page">
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="m3 6 9-4 9 4v12l-9 4-9-4Zm0 0 9 4 9-4M12 10v12M7 4l10 4"
              /></svg
            ><span>Mis pedidos</span>
          </a>

          <a
            routerLink="/perfil-comprador/cotizacion"
            routerLinkActive="activo"
            ariaCurrentWhenActive="page">
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M6 2h8l4 4v16H6ZM14 2v5h4M9 11h6M9 15h6M9 18h3" /></svg
            ><span>Cotizaciones solicitadas</span>
          </a>
          <a
          href="disenos.html"
        ><svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
          <path
            d="M20.8 4.6a5.5 5.5 0 0 0-8 .4l-.8 1-.8-1a5.5 5.5 0 0 0-8 7.5L12 22l8.8-9.5a5.5 5.5 0 0 0 0-7.9Z"
          /></svg
        ><span>Mis diseños</span></a>
        </nav>
        <button class="logout" type="button" data-action="logout">
          Cerrar sesión
        </button>
      </aside>


  </aside>

  <main id="contenido">
    <router-outlet></router-outlet>
  </main>
</div>
